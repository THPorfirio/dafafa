<section aria-labelledby="contato-title">
  <div id="leftbox">
    <div class="titulo" id="contato-title">Agradecemos o interesse!</div>
    <img src="images/heart.svg" alt="" class="heart" aria-hidden="true">
    <div class="texto"><p>Para mais informações, entre em contato com a Fafá.</p></div>
  </div>

  <article>
    <form data-contact-form action="#" method="post" novalidate>
      <div class="form__group">
        <label class="form__label" for="name">Nome</label>
        <input type="text" class="form__field" placeholder="Seu nome" name="name" id="name" autocomplete="name" required>
      </div>

      <div class="form__group">
        <label class="form__label" for="email">E-mail</label>
        <input type="email" class="form__field" placeholder="seu@email.com" name="email" id="email" autocomplete="email" required>
      </div>

      <div class="form__group">
        <label class="form__label" for="telefone">Telefone</label>
        <input type="tel" class="form__field" placeholder="(00) 00000-0000" name="telefone" id="telefone" autocomplete="tel" inputmode="tel" required>
      </div>

      <div class="form__group">
        <label class="form__label" for="produto">Produto de interesse</label>
        <select class="form__field" name="produto" id="produto" required>
          <option value="" selected disabled>Selecione uma opção</option>
          <option value="convites">Convites</option>
          <option value="padrinhos">Padrinhos e madrinhas</option>
          <option value="pajens">Pajens e damas</option>
          <option value="papelaria">Papelaria</option>
          <option value="lembrancas">Lembranças</option>
        </select>
      </div>

      <div class="form__group">
        <label class="form__label" for="coment">Mensagem</label>
        <textarea class="form__field" placeholder="Conte um pouco sobre o seu projeto..." name="comentario" id="coment" rows="5" required></textarea>
      </div>

      <div class="btsize">
        <button class="finalbtn" type="submit"><span aria-hidden="true">Enviar mensagem</span><span class="sr-only">Enviar mensagem</span></button>
      </div>
      <p data-form-status role="status" aria-live="polite"></p>
    </form>
  </article>
</section>
